<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digital Garden</title>
<style>
:root{--bg:#f4f1ea;--fg:#22301f;--mut:#6b7566;--card:#fffdf8;--line:#2f5d3a;--acc:#2f7d46;--kw:#b4691f;--bd:#d9d3c3;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1511;--fg:#e4eadf;--mut:#8fa08c;--card:#16201a;--line:#6fcf8a;--acc:#6fcf8a;--kw:#e8a35a;--bd:#2a3a2f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1511;--fg:#e4eadf;--mut:#8fa08c;--card:#16201a;--line:#6fcf8a;--acc:#6fcf8a;--kw:#e8a35a;--bd:#2a3a2f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 8px;pointer-events:none}
header>*{pointer-events:auto}
h1{font:600 18px Georgia,serif;margin:0 6px 0 0}
input,textarea,button{font:inherit;color:var(--fg)}
input,textarea{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box}
#q{width:190px}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
#note{font-size:12px;color:var(--mut);flex-basis:100%}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--card);border-left:1px solid var(--bd);box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto;transform:translateX(102%);transition:transform .25s}
#panel.o{transform:none}
#panel h2{font:600 24px Georgia,serif;margin:0 28px 8px 0}
#panel img,#panel video{max-width:100%;border-radius:8px;margin:6px 0}
#panel p{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;padding:2px 9px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border-radius:99px;border:1px solid var(--kw);color:var(--kw);background:none;font-size:13px}
.lk{display:block;text-align:left;width:100%;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
#zm{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:6px}#zm button{width:38px;height:38px;font-size:20px;padding:0}
.f{display:block;margin:10px 0 4px;color:var(--mut);font-size:13px}
</style></head><body>
<canvas id="c"></canvas>
<header><h1>Digital Garden</h1><input id="q" type="search" placeholder="Search the garden"><button id="add" class="p" hidden>+ Plant a topic</button><button id="dl" hidden>Download topics.json</button><button id="gh" hidden>GitHub connection</button><button id="rs" hidden>Reset draft</button><span id="note"></span></header>
<div id="zm"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">&minus;</button></div>
<aside id="panel"></aside>
<script>
const $=s=>document.querySelector(s);
const GH={o:'psycotimi',r:'Garden'},TK='garden-gh-token';
const EDIT=location.hash==='#edit',DK='garden-draft',INV=1; /* INV: set to -1 to flip vertical drag */
let topics=[],canEdit=EDIT,nodes=[],edges=[],sel=null,hover=null,q='',open=false,msg='';
addEventListener('hashchange',()=>location.reload());
function el(t,a,...c){const e=document.createElement(t);for(const k in a||{}){if(k==='on')for(const v in a.on)e.addEventListener(v,a.on[v]);else if(k in e)e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e}

/* ---------- data: topics.json (read from the site, or via the GitHub API when editing) ---------- */
const tok=()=>{try{return localStorage.getItem(TK)||''}catch(e){return ''}};
const enc=x=>btoa(unescape(encodeURIComponent(x)));
const hash=x=>{let h=0;for(const c of x)h=(h*31+c.codePointAt(0))>>>0;return h.toString(36)};
function norm(d){return(Array.isArray(d)?d:(d&&d.topics)||[]).map(t=>{const title=String(t.title||'');
  return{...t,id:t.id||'t-'+hash(title),title,kw:Array.isArray(t.kw)?t.kw.map(String):String(t.kw||'').split(',').map(k=>k.trim()).filter(Boolean),body:String(t.body||'')}})}
const gh=(path,o={})=>fetch('https://api.github.com/repos/'+GH.o+'/'+GH.r+'/contents/'+path,{cache:'no-store',...o,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tok(),...(o.headers||{})}});
async function readRemote(){
  const r=await gh('topics.json');
  if(!r.ok)throw new Error(r.status===401?'token rejected':r.status===404?'topics.json not found, or the token has no access to the repo':'HTTP '+r.status);
  const j=await r.json();let txt;
  if(j.content&&j.encoding==='base64')txt=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
  else txt=await(await gh('topics.json',{headers:{Accept:'application/vnd.github.raw+json'}})).text();
  let d;try{d=JSON.parse(txt)}catch(e){throw new Error('topics.json is not valid JSON')}
  return{list:norm(d),sha:j.sha}}
async function init(){
  let live=false;
  if(EDIT&&tok()){try{topics=(await readRemote()).list;live=true}catch(e){msg='Could not reach GitHub ('+e.message+'). Showing the published copy.'}}
  if(!live){try{const r=await fetch('topics.json',{cache:'no-store'});if(!r.ok)throw 0;topics=norm(await r.json())}
    catch(e){topics=[];msg=msg||'Could not load topics.json. Open the site through GitHub Pages or a local web server.'}}
  if(EDIT){
    ['add','dl','rs','gh'].forEach(i=>$('#'+i).hidden=false);
    if(!live){try{const d=JSON.parse(localStorage.getItem(DK)||'null');if(Array.isArray(d)){topics=norm(d);msg='Showing your unpublished draft. Connect GitHub or download topics.json to publish it.'}}catch(e){}}
  }
  rebuild();
}
function draft(m){try{localStorage.setItem(DK,JSON.stringify(topics))}catch(e){}msg=m||'Unpublished changes. Connect GitHub or download topics.json to publish them.';rebuild()}
/* apply a change to the newest copy on GitHub, so edits from other devices are never overwritten */
async function commit(fn,label){
  if(!tok()){topics=fn(topics);draft();return false}
  $('#note').textContent='Saving to GitHub…';let err='';
  for(let k=0;k<2;k++){
    try{
      const{list,sha}=await readRemote(),next=fn(list);
      const r=await gh('topics.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:label,content:enc(JSON.stringify(next,null,2)+'\n'),sha})});
      if(r.status===409||r.status===422){err='HTTP '+r.status;continue}
      if(!r.ok)throw new Error(r.status===401||r.status===403||r.status===404?'the token cannot write to this repo':'HTTP '+r.status);
      topics=next;try{localStorage.removeItem(DK)}catch(e){}
      msg='Saved to GitHub. The live site updates in about a minute.';rebuild();return true
    }catch(e){err=e.message;break}}
  topics=fn(topics);draft('Could not save to GitHub ('+err+'). Kept as an unpublished draft. You can download topics.json instead.');return false}
function download(){
  const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(topics,null,2)],{type:'application/json'})),download:'topics.json'});
  document.body.append(a);a.click();a.remove()}

/* ---------- graph ---------- */
function rebuild(){
  $('#note').textContent=msg||(topics.length?'':'The garden is empty.'+(EDIT?' Plant your first topic.':''));
  nodes=[];edges=[];const km={};
  topics.forEach(t=>nodes.push({type:'t',id:t.id,label:t.title||'Untitled',t}));
  topics.forEach((t,i)=>new Set((t.kw||[]).map(k=>k.trim().toLowerCase()).filter(Boolean)).forEach(k=>{
    let n=km[k];if(!n){n=km[k]={type:'k',id:'k:'+k,label:k,topics:[]};nodes.push(n)}
    n.topics.push(t);edges.push([nodes[i],n])}));
  const N=nodes.length;
  nodes.forEach((n,i)=>{const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.39996;n.p=[Math.cos(a)*r,y,Math.sin(a)*r]});
  for(let it=0;it<140;it++){
    const f=nodes.map(()=>[0,0,0]);
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
      const a=nodes[i].p,b=nodes[j].p,d=[a[0]-b[0],a[1]-b[1],a[2]-b[2]],s=.004/(d[0]*d[0]+d[1]*d[1]+d[2]*d[2]+.06);
      for(let k=0;k<3;k++){f[i][k]+=d[k]*s;f[j][k]-=d[k]*s}}
    for(const [a,b] of edges){const i=nodes.indexOf(a),j=nodes.indexOf(b);
      for(let k=0;k<3;k++){const d=(b.p[k]-a.p[k])*.03;f[i][k]+=d;f[j][k]-=d}}
    nodes.forEach((n,i)=>{let p=n.p.map((v,k)=>v+f[i][k]);const l=Math.hypot(...p)||1;n.p=p.map(v=>v/l)});
  }
  if(sel)sel=nodes.find(n=>n.id===sel.id)||null;
}

/* ---------- drawing ---------- */
const cv=$('#c'),g=cv.getContext('2d');let W,H,D,M=[1,0,0,0,1,0,0,0,1],zoom=1,drag=null,fr=0,C={};
const setZoom=z=>{zoom=Math.max(.4,Math.min(4,z))};
function rs(){D=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener('resize',rs);rs();
function rot(a,b){const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),Rx=[1,0,0,0,ca,-sa,0,sa,ca],Ry=[cb,0,sb,0,1,0,-sb,0,cb],mul=(A,B)=>{const o=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)o.push(A[r*3]*B[c]+A[r*3+1]*B[3+c]+A[r*3+2]*B[6+c]);return o};M=mul(Rx,mul(Ry,M))}
rot(.3,.5);
const match=n=>!q||n.label.toLowerCase().includes(q)||(n.t&&(n.t.body||'').toLowerCase().includes(q));
function draw(){
  if(fr++%30===0){const s=getComputedStyle(document.documentElement);for(const k of['fg','mut','line','acc','kw'])C[k]=s.getPropertyValue('--'+k).trim()}
  if(!drag&&!open&&!ptr.size)rot(0,.0015);
  g.setTransform(D,0,0,D,0,0);g.clearRect(0,0,W,H);
  const R=Math.min(W,H)*.36*zoom,X=W/2,Y=H/2;
  for(const n of nodes){const[x,y,z]=n.p,x1=M[0]*x+M[1]*y+M[2]*z,y1=M[3]*x+M[4]*y+M[5]*z,z2=M[6]*x+M[7]*y+M[8]*z,s=3/(3-z2);n.sx=X+x1*R*s;n.sy=Y+y1*R*s;n.z=z2;n.k=s}
  g.globalAlpha=.12;g.strokeStyle=C.line;g.lineWidth=1;g.beginPath();g.arc(X,Y,R,0,7);g.stroke();
  for(const[a,b]of edges){
    let al=.06+.4*((a.z+b.z)/2+1)/2;if(q&&!(match(a)&&match(b)))al*=.25;
    const on=sel&&(a===sel||b===sel);g.globalAlpha=on?.9:al;g.lineWidth=on?1.8:1;g.strokeStyle=C.line;
    g.beginPath();g.moveTo(a.sx,a.sy);g.lineTo(b.sx,b.sy);g.stroke()}
  g.textBaseline='middle';
  for(const n of[...nodes].sort((a,b)=>a.z-b.z)){
    const t=n.type==='t',dep=.3+.7*(n.z+1)/2,hi=n===sel||n===hover,r=(t?6:3.4)*n.k;
    g.globalAlpha=(match(n)?dep:dep*.2);g.fillStyle=t?C.acc:C.kw;
    g.beginPath();g.arc(n.sx,n.sy,r,0,7);g.fill();
    if(hi){g.strokeStyle=C.fg;g.lineWidth=2;g.beginPath();g.arc(n.sx,n.sy,r+4,0,7);g.stroke()}
    if(hi||(t&&n.z>-.35)||(!t&&n.z>.15)){
      g.font=(t?'600 '+13*n.k:11*n.k)+'px system-ui,sans-serif';g.fillStyle=t?C.fg:C.mut;g.fillText(n.label,n.sx+r+5,n.sy)}
  }
  g.globalAlpha=1;requestAnimationFrame(draw)
}
function hit(x,y){let b=null,bd=18;for(const n of nodes){if(n.z<-.45)continue;const d=Math.hypot(n.sx-x,n.sy-y)-(n.z>0?2:0);if(d<bd){bd=d;b=n}}return b}

/* ---------- input: drag to rotate, wheel / pinch / buttons / keys to zoom ---------- */
const ptr=new Map();let pd=0,pinched=false;
const dist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
cv.addEventListener('pointerdown',e=>{
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cv.setPointerCapture(e.pointerId);
  if(ptr.size===1)drag={x:e.clientX,y:e.clientY,m:0};
  else if(ptr.size===2){drag=null;pinched=true;pd=dist()}});
cv.addEventListener('pointermove',e=>{
  if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===2){const d=dist();setZoom(zoom*d/pd);pd=d}
  else if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);rot(-dy*.006*INV,dx*.006);drag.x=e.clientX;drag.y=e.clientY}
  else if(!ptr.size){hover=hit(e.clientX,e.clientY);cv.style.cursor=hover?'pointer':'grab'}});
const up=e=>{
  if(drag&&drag.m<6&&!pinched&&e.type==='pointerup'){const n=hit(e.clientX,e.clientY);if(n)openNode(n);else closePanel()}
  ptr.delete(e.pointerId);drag=null;if(!ptr.size)pinched=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)))},{passive:false});
$('#zi').onclick=()=>setZoom(zoom*1.25);$('#zo').onclick=()=>setZoom(zoom/1.25);
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='+'||e.key==='=')setZoom(zoom*1.15);if(e.key==='-')setZoom(zoom/1.15)});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase()});
$('#add').onclick=()=>edit();$('#dl').onclick=download;$('#gh').onclick=()=>tokenPanel();
$('#rs').onclick=()=>{try{localStorage.removeItem(DK)}catch(e){}location.reload()};

/* ---------- panel ---------- */
const P=$('#panel');
function show(...c){P.replaceChildren(el('button',{className:'x',textContent:'×',on:{click:closePanel}}),...c);P.classList.add('o');open=true;P.scrollTop=0}
function closePanel(){P.classList.remove('o');open=false;sel=null}
function openNode(n){sel=n;n.type==='t'?viewTopic(n.t):viewKw(n)}
function goKw(k){const n=nodes.find(x=>x.id==='k:'+k.trim().toLowerCase());if(n)openNode(n)}
const okPath=u=>/^(https?:\/\/|data:image\/|[A-Za-z0-9_][A-Za-z0-9_\-. \/]*$)/.test(u);
function body(b){
  const f=[];
  for(const line of(b||'').split('\n')){
    let m;
    if(m=line.match(/^\[img:(.+)\]$/))f.push(okPath(m[1])?el('img',{src:m[1],loading:'lazy'}):el('p',{textContent:line}));
    else if(m=line.match(/^\[video:(.+)\]$/)){const u=m[1];
      if(!okPath(u)||u.startsWith('data:'))f.push(el('p',{textContent:line}));
      else if(/\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u))f.push(el('video',{src:u,controls:true,preload:'metadata'}));
      else f.push(el('p',{},el('a',{href:u,target:'_blank',rel:'noopener noreferrer',textContent:'▶ Watch video'})))}
    else if(line.trim())f.push(el('p',{textContent:line}))}
  return f}
function viewTopic(t){
  const rel=new Set();nodes.filter(n=>n.type==='k'&&n.topics.includes(t)).forEach(k=>k.topics.forEach(o=>o!==t&&rel.add(o)));
  show(el('h2',{textContent:t.title||'Untitled'}),
    el('div',{},(t.kw||[]).map(k=>el('button',{className:'chip',textContent:k,on:{click:()=>goKw(k)}}))),
    ...body(t.body),
    rel.size?el('h3',{textContent:'Related'}):'',
    ...[...rel].map(o=>el('button',{className:'lk',textContent:o.title,on:{click:()=>openNode(nodes.find(n=>n.t===o))}})),
    canEdit?el('div',{className:'row'},el('button',{textContent:'Edit',on:{click:()=>edit(t)}})):'')}
function viewKw(n){
  show(el('h2',{textContent:n.label}),el('h3',{textContent:'Topics with this keyword'}),
    ...n.topics.map(t=>el('button',{className:'lk',textContent:t.title,on:{click:()=>openNode(nodes.find(x=>x.t===t))}})))}

/* ---------- editor (only at #edit) ---------- */
const readURL=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function shrink(f){
  const src=await readURL(f);
  return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.onerror=no;i.src=src})}
function edit(old){
  const t=old||{id:'t'+Date.now().toString(36),title:'',kw:[],body:''};
  const ti=el('input',{value:t.title,placeholder:'Title'}),ki=el('input',{value:(t.kw||[]).join(', '),placeholder:'e.g. notes, web, gardening'});
  const bo=el('textarea',{value:t.body||'',rows:12,placeholder:'Write here. Add pictures and videos with the buttons below.'});
  const st=el('div',{style:'color:var(--mut);font-size:13px;min-height:20px'});
  const ins=s=>{const a=bo.selectionStart??bo.value.length;bo.value=bo.value.slice(0,a)+s+bo.value.slice(a)};
  const pi=el('input',{placeholder:'File path or link, e.g. images/tree.jpg'});
  const add=(tag)=>()=>{const v=pi.value.trim();if(okPath(v)){ins('\n['+tag+':'+v+']\n');pi.value='';st.textContent=''}else st.textContent='Enter a file path like images/tree.jpg or a full https:// link.'};
  show(el('h2',{textContent:old?'Edit topic':'Plant a topic'}),
    el('label',{className:'f',textContent:'Title'}),ti,
    el('label',{className:'f',textContent:'Keywords'}),ki,
    el('label',{className:'f',textContent:'Body'}),bo,
    el('div',{className:'row'},pi),
    el('div',{className:'row'},el('button',{textContent:'+ Picture',on:{click:add('img')}}),el('button',{textContent:'+ Video',on:{click:add('video')}}),
      el('button',{textContent:'+ Picture from device',on:{click:()=>{const i=el('input',{type:'file',accept:'image/*'});i.onchange=async()=>{if(!i.files[0])return;try{
        const d=await shrink(i.files[0]);
        if(tok()){st.textContent='Uploading picture…';const name='images/'+Date.now().toString(36)+'.jpg';
          const r=await gh(name,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Add picture',content:d.split(',')[1]})});
          if(!r.ok)throw new Error('Upload failed (HTTP '+r.status+')');ins('\n[img:'+name+']\n');st.textContent='Picture uploaded. It appears on the live site after about a minute.'}
        else ins('\n[img:'+d+']\n')}catch(e){st.textContent=e.message||'That file could not be added.'}};i.click()}}})),
    st,
    el('div',{className:'row'},
      el('button',{className:'p',textContent:'Save',on:{click:async()=>{
        if(!ti.value.trim()){st.textContent='Please give it a title.';return}
        const n={id:t.id,title:ti.value.trim(),kw:[...new Set(ki.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean))],body:bo.value};
        await commit(l=>{const i=l.findIndex(x=>x.id===n.id);return i<0?[...l,n]:l.map((x,j)=>j===i?n:x)},'Update topic: '+n.title);
        const nn=nodes.find(x=>x.id===n.id);nn?openNode(nn):closePanel()}}}),
      el('button',{textContent:'Cancel',on:{click:()=>old?viewTopic(old):closePanel()}}),
      old?(()=>{const b=el('button',{textContent:'Delete'});let s=0;b.onclick=async()=>{if(!s){s=1;b.textContent='Sure? Click again';return}await commit(l=>l.filter(x=>x.id!==old.id),'Delete topic: '+old.title);closePanel()};return b})():''))}

function tokenPanel(){
  const ti=el('input',{type:'password',placeholder:'Paste token here',autocomplete:'off'}),st=el('div',{style:'color:var(--mut);font-size:13px;min-height:20px'});
  show(el('h2',{textContent:'GitHub connection'}),
    el('p',{textContent:tok()?'Connected. Saving a topic writes it straight to topics.json on GitHub.':'Not connected. Saving only keeps a draft that you download yourself.'}),
    el('p',{textContent:'The token stays in this browser only. Do this once on each device you edit from.'}),
    el('p',{textContent:'1. Create a fine-grained token on GitHub. 2. Repository access: only select repositories, and choose Garden. 3. Repository permissions: Contents, Read and write. 4. Set an expiry, generate it and paste it below.'}),
    el('p',{},el('a',{href:'https://github.com/settings/personal-access-tokens/new',target:'_blank',rel:'noopener noreferrer',textContent:'Create a token on GitHub'})),
    ti,
    el('div',{className:'row'},
      el('button',{className:'p',textContent:'Save token',on:{click:async()=>{
        const v=ti.value.trim();if(!v){st.textContent='Paste the token first.';return}
        try{localStorage.setItem(TK,v)}catch(e){st.textContent='This browser blocks storage.';return}
        st.textContent='Checking…';
        try{const r=await readRemote();topics=r.list;try{localStorage.removeItem(DK)}catch(e){}msg='';rebuild();st.textContent='Connected. Found '+r.list.length+' topics in topics.json.'}
        catch(e){try{localStorage.removeItem(TK)}catch(x){}st.textContent='Could not connect: '+e.message}}}}),
      el('button',{textContent:'Remove token',on:{click:()=>{try{localStorage.removeItem(TK)}catch(e){}st.textContent='Token removed from this browser.'}}})),
    st)}

init();requestAnimationFrame(draw);
</script></body></html>
